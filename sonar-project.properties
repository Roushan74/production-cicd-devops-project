# ---------------------------------------------------------------------------
# SonarQube / SonarCloud project configuration
#
# Works with either:
#   * SonarQube Cloud  -> SONAR_HOST_URL = https://sonarcloud.io
#   * SonarQube Server -> SONAR_HOST_URL = https://sonar.your-domain.tld
#
# `sonar.organization` is only used by SonarQube Cloud. Change it to match the
# organisation key shown in your SonarQube Cloud account before the first scan,
# or the analysis will be rejected.
# ---------------------------------------------------------------------------

sonar.projectKey=Roushan74_production-cicd-devops-project
sonar.organization=roushan74
sonar.projectName=production-cicd-devops-project
sonar.projectVersion=1.0.0

sonar.sourceEncoding=UTF-8

# Application code is the only thing measured for coverage/duplication.
sonar.sources=src
sonar.tests=tests

# Never analyse dependencies, build output, generated reports or docs.
sonar.exclusions=\
  node_modules/**,\
  coverage/**,\
  .scannerwork/**,\
  docs/**,\
  **/*.md

# Test files are analysed as tests (so their assertions are not counted as
# production code), and coverage is attached from the Jest LCOV report.
sonar.test.inclusions=tests/**/*.test.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  src/server.js,\
  tests/**,\
  **/*.config.js

# Fail the CI job when the configured quality gate is red.
sonar.qualitygate.wait=true

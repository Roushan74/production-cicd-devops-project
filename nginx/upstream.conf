# ---------------------------------------------------------------------------
# Upstream definition for the Nginx reverse proxy.
#
# This file is REWRITTEN BY scripts/deploy.sh on every deployment: it is the
# single switch that moves production traffic between the blue slot (:3000) and
# the green slot (:3001). Nginx is then reloaded gracefully, so in-flight
# requests finish on the old worker while new requests go to the new slot.
#
# Installed at: /etc/nginx/notes-upstream.conf
# Included by : /etc/nginx/conf.d/notes-api.conf
# ---------------------------------------------------------------------------

upstream notes_api {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

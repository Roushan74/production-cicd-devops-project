# ---------------------------------------------------------------------------
# Nginx reverse proxy - PRODUCTION configuration (runs on the EC2 host).
#
#   Internet -> EC2 security group (:80) -> Nginx :80
#                                        -> 127.0.0.1:3000 | 127.0.0.1:3001
#                                        -> Docker container -> Node/Express
#
# Installed at: /etc/nginx/conf.d/notes-api.conf
# Validate    : sudo nginx -t
# Apply       : sudo nginx -s reload
#
# The upstream block lives in /etc/nginx/notes-upstream.conf and is rewritten
# by scripts/deploy.sh to switch between the blue (:3000) and green (:3001)
# slots. Only port 80 is open in the security group: the application containers
# bind to the loopback interface, so they are unreachable from the internet
# even though they publish a port.
# ---------------------------------------------------------------------------

include /etc/nginx/notes-upstream.conf;

server {
    listen 80 default_server;
    server_name _;

    # Do not advertise the Nginx version.
    server_tokens off;

    # The API only accepts small JSON documents; anything larger is refused
    # before it reaches Node.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    access_log /var/log/nginx/notes_api.access.log;
    error_log  /var/log/nginx/notes_api.error.log warn;

    # Helmet already sets these in the app; repeating them here means they are
    # still present if a request is answered by Nginx itself (e.g. 502/503).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types application/json;
    gzip_min_length 512;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Correlation id: reuse the client's value if present, otherwise generate.
    proxy_set_header X-Request-Id $request_id;

    # Timeouts: fail fast on a dead upstream, allow normal requests to finish.
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    # Health endpoint: no access-log noise (it is polled every few seconds).
    location = /health {
        access_log off;
        proxy_pass http://notes_api;
    }

    location / {
        proxy_pass http://notes_api;
    }

    # Graceful degradation: if both slots are down, answer with a JSON 503
    # instead of Nginx's HTML error page.
    error_page 502 503 504 = @upstream_unavailable;
    location @upstream_unavailable {
        default_type application/json;
        add_header Retry-After 5 always;
        return 503 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"Service temporarily unavailable, please retry shortly"}}';
    }

    # Block dotfile probes so they never reach the application.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }
}

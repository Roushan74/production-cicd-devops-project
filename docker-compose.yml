# ---------------------------------------------------------------------------
# Local development / demo stack.
#
#   docker compose up --build      -> http://localhost:3000
#   docker compose down            -> stop and remove
#
# Nginx is intentionally NOT part of this file: the production reverse proxy
# runs directly on the EC2 host (see nginx/default.conf and docs/deployment.md).
# Keeping compose to a single service means `docker compose up` reproduces the
# exact container that CI builds and that EC2 runs.
# ---------------------------------------------------------------------------
services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0-local}
        GIT_SHA: ${GIT_SHA:-local}
    image: production-cicd-devops-project:local
    container_name: notes-api-local
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-1.0.0-local}
    # Hardening that also mirrors the production run command.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
